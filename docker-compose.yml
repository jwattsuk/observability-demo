version: '3.8'

services:
  postgresql:
    image: postgres:15-alpine
    container_name: trade-db
    environment:
      POSTGRES_DB: tradedb
      POSTGRES_USER: tradeuser
      POSTGRES_PASSWORD: tradepass
    ports:
      - "5432:5432"
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trade-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeuser -d tradedb"]
      interval: 30s
      timeout: 10s
      retries: 3

  enrichment-service:
    build:
      context: ./enrichment-service
      dockerfile: Dockerfile
    container_name: enrichment-service
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
      - OTEL_SERVICE_NAME=enrichment-service
      - OTEL_RESOURCE_ATTRIBUTES=service.name=enrichment-service,service.version=1.0.0-SNAPSHOT,deployment.environment=docker-compose
    networks:
      - trade-network
    labels:
      logging: "promtail"
      service: "enrichment-service"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  trade-service:
    build:
      context: ./trade-service
      dockerfile: Dockerfile
    container_name: trade-service
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_NAME=tradedb
      - DB_USER=tradeuser
      - DB_PASSWORD=tradepass
      - ENRICHMENT_SERVICE_URL=http://enrichment-service:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
      - OTEL_SERVICE_NAME=trade-service
      - OTEL_RESOURCE_ATTRIBUTES=service.name=trade-service,service.version=1.0.0-SNAPSHOT,deployment.environment=docker-compose
    depends_on:
      postgresql:
        condition: service_healthy
      enrichment-service:
        condition: service_healthy
    networks:
      - trade-network
    labels:
      logging: "promtail"
      service: "trade-service"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web-ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:8082
    container_name: trade-web-ui
    ports:
      - "3000:3000"
    depends_on:
      trade-service:
        condition: service_healthy
    networks:
      - trade-network
    labels:
      logging: "promtail"
      service: "web-ui"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Observability Stack
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - trade-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/"]
      interval: 30s
      timeout: 10s
      retries: 3

  tempo:
    image: grafana/tempo:2.3.1
    container_name: tempo
    ports:
      - "3200:3200"
      - "4317:4317"  # OTLP gRPC receiver
      - "4318:4318"  # OTLP HTTP receiver
    volumes:
      - ./observability/tempo:/etc/tempo
      - tempo_data:/tmp/tempo
    command:
      - '-config.file=/etc/tempo/tempo.yml'
    networks:
      - trade-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki:/etc/loki
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yml
    networks:
      - trade-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail
    volumes:
      - ./observability/promtail:/etc/promtail
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - trade-network
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    networks:
      - trade-network
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  tempo_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local

networks:
  trade-network:
    driver: bridge