server:
  port: 8080

spring:
  application:
    name: enrichment-service
  profiles:
    active: default

# Default profile configuration
---
spring:
  config:
    activate:
      on-profile: default

enrichment:
  delay:
    min: 100
    max: 1500
  failure:
    rate: 0.02

logging:
  level:
    com.jwattsuk.enrichment: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [%X{traceId:-},%X{spanId:-}] - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.9,0.95,0.99
  tracing:
    sampling:
      probability: 1.0

# OpenTelemetry configuration
otel:
  exporter:
    otlp:
      endpoint: http://tempo:4318
      protocol: http/protobuf
  resource:
    attributes:
      service.name: enrichment-service
      service.version: 1.0.0-SNAPSHOT
      deployment.environment: docker-compose

---
spring:
  config:
    activate:
      on-profile: docker

enrichment:
  delay:
    min: 200
    max: 2000
  failure:
    rate: 0.05

logging:
  level:
    root: INFO
    com.jwattsuk.enrichment: INFO
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0