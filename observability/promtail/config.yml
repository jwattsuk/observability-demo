server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)' 
        target_label: 'container_name'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - source_labels: ['__meta_docker_container_label_logging']
        target_label: 'logging'
    pipeline_stages:
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2}'
          max_wait_time: 3s
      - regex:
          expression: '^(?P<timestamp>\S+)\s+(?P<level>\S+)\s+(?P<pid>\S+)\s+---\s+\[\s*(?P<thread>.*?)\s*\]\s+(?P<logger>\S+)\s*:\s+(?P<message>.*)'
      - labels:
          level:
          thread:
          logger:
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05.000'

  # Application-specific container logs with better parsing
  - job_name: spring-boot-apps
    static_configs:
      - targets:
          - localhost
        labels:
          job: spring-boot-apps
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          source: attrs
          expressions:
            tag:
      - regex:
          source: tag
          expression: '^(?P<container_name>(?P<image_name>(?P<project>[^_]+)_(?P<service>[^_]+))_\d+)$'
      - labels:
          stream:
          container_name:
          image_name:
          project:
          service:
      - match:
          selector: '{project="observability-demo"}'
          stages:
            - regex:
                source: output
                expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2}\.\d{3})\s+(?P<level>\w+)\s+(?P<pid>\d+)\s+---\s+\[\s*(?P<thread>.*?)\s*\]\s+(?P<logger>[\w.]+)\s*:\s+(?P<message>.*?)(?:\s+(?P<mdc>\{.*\}))?$'
            - labels:
                level:
                thread:
                logger:
            - timestamp:
                source: timestamp
                format: '2006-01-02 15:04:05.000'